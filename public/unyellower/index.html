<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNYELLOWER</title>

  <style>
    :root{
      /* Match portfolio default dark (home) */
      --bg:#050505; --fg:#E9EEF6; --muted:#A5B3C2;
      --card:#0B0B0B; --border:#1A1A1A; --soft:#070707;
      --btn:#0B1E19; --btnHover:#0F2A22; --btnText:#E9EEF6;

      --primary:#6ee7ff;
      --primary2:#9b7bff;

      --shadow: 0 18px 44px rgba(0,0,0,.42);
      --shadow2: 0 10px 22px rgba(0,0,0,.34);
      --radius: 16px;
    }
    [data-theme="light"]{
      --bg:#F6F8FB; --fg:#0D1117; --muted:#5A6573;
      --card:#FFFFFF; --border:#DBE2EA; --soft:#F1F4F8;
      --btn:#FFFFFF; --btnHover:#F7F9FB; --btnText:#0D1117;

      --shadow: 0 18px 40px rgba(16,24,40,.12);
      --shadow2: 0 10px 22px rgba(16,24,40,.10);
    }

    body{
      margin: 18px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, "Futura", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: .2px;
    }

    .app{
      max-width: 1680px;
      width: min(1680px, calc(100vw - 36px));
      margin: 0 auto;
      display:flex;
      flex-direction: column;
      gap: 14px;
    }

    .header{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 12px;
      margin-bottom: 2px;
    }
    .title{
      grid-column: 2;
      text-align:center;
      font-weight: 800;
      letter-spacing: .22em;
      font-size: 18px;
      text-transform: uppercase;
      opacity: .95;
      padding-top: 4px;
    }
    .headerRight{ grid-column: 3; justify-self: end; }

    .modeToggle{ display:flex; align-items:center; gap: 12px; user-select:none; }
    .modeLabel{ font-weight: 700; font-size: 18px; letter-spacing: .02em; opacity: .40; transition: opacity .18s ease; }
    [data-theme="light"] .modeLabel.light{ opacity: 1; }
    [data-theme="dark"] .modeLabel.dark{ opacity: 1; }
    .switch{
      width: 84px; height: 38px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow2);
      cursor:pointer;
      display:flex; align-items:center;
      padding: 3px;
    }
    [data-theme="light"] .switch{
      background: linear-gradient(180deg, rgba(16,24,40,.08), rgba(16,24,40,.04));
      border: 1px solid rgba(16,24,40,.10);
    }
    .knob{
      width: 32px; height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.28), rgba(255,255,255,.08) 45%, rgba(0,0,0,.14));
      display:flex; align-items:center; justify-content:center;
      transition: transform .22s ease;
      position: relative; overflow:hidden;
    }
    [data-theme="dark"] .knob{ transform: translateX(46px); }
    .stars{ position:absolute; inset:0; opacity:.95; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
    .moon{ width: 16px; height: 16px; border-radius: 50%; background: #fff; position: relative; box-shadow: 0 6px 18px rgba(255,255,255,.18); }
    .moon:after{ content:""; position:absolute; width: 12px; height: 12px; border-radius: 50%; right:-2px; top:2px; background: rgba(0,0,0,.18); }
    [data-theme="light"] .moon:after{ background: rgba(255,255,255,.75); }
    [data-theme="light"] .stars{ opacity: 0; }
    [data-theme="light"] .knob{ background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.45) 45%, rgba(16,24,40,.08)); }

    .content{
      display:grid;
      grid-template-columns: 392px 1fr;
      gap: 16px;
      align-items:start;
    }
    @media (max-width: 1080px){
      .content{ grid-template-columns: 1fr; }
      .header{ grid-template-columns: 1fr; }
      .title{ grid-column: 1; }
      .headerRight{ grid-column: 1; justify-self: start; }
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .controls{ padding: 16px; }
    .hint{ color: var(--muted); font-size: 12.8px; line-height: 1.4; margin: 10px 0 0; }
    .fileRow{ display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    input[type="file"]{ color: var(--muted); }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.02);
      color: var(--muted);
      font-size: 12.5px;
    }

    .drop{
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.18);
      color: var(--muted);
      text-align:center;
      background: rgba(255,255,255,.02);
    }
    [data-theme="light"] .drop{
      border: 1px dashed rgba(16,24,40,.18);
      background: rgba(16,24,40,.02);
    }

    .divider{ height:1px; background: var(--border); margin: 12px 0; opacity:.7; }
    label{ display:block; margin-top: 12px; }
    .labelTop{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity:.95; }
    input[type="range"]{ width:100%; }

    .btns{ display:flex; gap:10px; flex-wrap: wrap; margin-top: 14px; }
    button{
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--btnText);
      cursor:pointer;
      font-weight: 650;
      letter-spacing: .01em;
    }
    button:hover{ background: var(--btnHover); }

    .btnPrimary{
      border: 0;
      background: linear-gradient(135deg, rgba(110,231,255,.95), rgba(155,123,255,.92));
      color: #071019;
      box-shadow: 0 14px 28px rgba(110,231,255,.12);
    }
    [data-theme="light"] .btnPrimary{
      color: #0b1320;
      box-shadow: 0 14px 28px rgba(16,24,40,.12);
    }
    .btnPrimary:hover{ filter: brightness(1.03); }

    .rowLine{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top: 10px; }
    .editPill{
      display:inline-flex; align-items:center; gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(110,231,255,.08);
      color: var(--fg);
      font-size: 12.5px;
    }
    [data-theme="light"] .editPill{ background: rgba(16,24,40,.06); }

    .smallBtn{
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--btnText);
      cursor:pointer;
      font-weight: 650;
    }
    .smallBtn:hover{ background: var(--btnHover); }

    .right{ display:flex; flex-direction: column; gap: 12px; min-width: 0; }

    .preview{ padding: 10px; position: relative; }
    .viewport{
      height: 56vh;
      min-height: 520px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--soft);
      border: 1px solid var(--border);
      position: relative;
    }
    canvas#mainCanvas{
      position:absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      /* applied via JS: translate(-50%,-50%) scale(finalScale) */
    }
    .tag{
      position:absolute;
      top: 16px; left: 16px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      color: white;
      background: rgba(0,0,0,.55);
      pointer-events:none;
      display:none;
      z-index: 2;
    }
    [data-theme="dark"] .tag{ background: rgba(255,255,255,.15); }

    .gridBar{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      padding: 12px 14px;
    }
    .gridBar strong{ letter-spacing:.06em; font-size: 12px; opacity:.85; }
    .gridBar .sp{ flex:1; }
    .gridWrap{ padding: 0 14px 14px; }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .tile{
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.02);
      overflow:hidden;
      cursor:pointer;
      position:relative;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .tile:hover{ transform: translateY(-1px); box-shadow: 0 10px 18px rgba(0,0,0,.18); }
    [data-theme="light"] .tile:hover{ box-shadow: 0 10px 18px rgba(16,24,40,.12); }
    .tile.active{ border-color: rgba(110,231,255,.65); box-shadow: 0 14px 26px rgba(110,231,255,.10); }

    .tile canvas{
      width:100%;
      height:auto;
      display:block;
      transform-origin: top left;
      transform: scale(var(--gridZoom, 1));
    }
    .tileMeta{
      position:absolute; left: 10px; bottom: 10px;
      font-size: 11px;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.55);
      padding: 6px 8px;
      border-radius: 999px;
      max-width: calc(100% - 20px);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    [data-theme="dark"] .tileMeta{ background: rgba(255,255,255,.16); }

.footerCredit{
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: .45;
  pointer-events: none;
  user-select: none;
  z-index: 999;
}

  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div></div>
      <div class="title">UNYELLOWER</div>
      <div class="headerRight">
        <div class="modeToggle" id="modeToggle" role="switch" aria-checked="true" tabindex="0">
          <div class="modeLabel light">Light</div>
          <div class="switch" aria-hidden="true">
            <div class="knob">
              <svg class="stars" viewBox="0 0 36 36" fill="none">
                <circle cx="10" cy="10" r="1.3" fill="white"/>
                <circle cx="16" cy="7" r="1.0" fill="white"/>
                <circle cx="22" cy="12" r="1.1" fill="white"/>
                <circle cx="13" cy="18" r="0.9" fill="white"/>
                <circle cx="24" cy="20" r="1.2" fill="white"/>
              </svg>
              <div class="moon" aria-hidden="true"></div>
            </div>
          </div>
          <div class="modeLabel dark">Dark</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card controls">
        <div class="fileRow">
          <input id="files" type="file" accept="image/*" multiple />
          <span class="pill" id="countPill">0 images</span>
        </div>
        <div id="drop" class="drop">Arrastrá imágenes acá (batch)</div>

        <p class="hint">
          Global por default. Activá <span class="mono">Edit selected</span> para override individual y luego descargás todo el batch.
        </p>

        <div class="divider"></div>

        <div class="rowLine">
          <span class="pill">Mode:</span>
          <span class="pill" id="modePill">Batch (global)</span>
          <button class="smallBtn" id="toggleEdit">Edit selected: OFF</button>
          <button class="smallBtn" id="clearOverride" title="Vuelve la seleccionada a settings globales">Clear override</button>
        </div>

        <label>
          <div class="labelTop"><span>Blue light</span><span id="blueVal" class="mono"></span></div>
          <input id="blue" type="range" min="-50" max="150" step="1">
        </label>

        <label>
          <div class="labelTop"><span>Color temperature</span><span id="tempVal" class="mono"></span></div>
          <input id="temp" type="range" min="1000" max="10000" step="50">
        </label>

        <label>
          <div class="labelTop"><span>Strength</span><span id="mixVal" class="mono"></span></div>
          <input id="mix" type="range" min="0" max="100" step="1">
        </label>

        <div class="divider"></div>

        <label>
          <div class="labelTop"><span>Main zoom</span><span id="mainZoomVal" class="mono"></span></div>
          <input id="mainZoom" type="range" min="25" max="220" step="5">
        </label>

        <label>
          <div class="labelTop"><span>Grid zoom</span><span id="gridZoomVal" class="mono"></span></div>
          <input id="gridZoom" type="range" min="25" max="200" step="5">
        </label>

        <div class="btns">
          <button class="btnPrimary" id="toggleAB">Antes/Después</button>
          <button id="reset">Reset</button>
          <button id="downloadOne">Download (selected)</button>
          <button id="downloadAll">Download (batch)</button>
        </div>
      </div>

      <div class="right">
        <div class="card preview">
          <div id="tag" class="tag">DESPUÉS</div>
          <div id="viewport" class="viewport">
            <canvas id="mainCanvas"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="gridBar">
            <strong>BATCH GRID</strong>
            <span class="pill" id="selectedPill">Selected: —</span>
            <span class="sp"></span>
            <span class="editPill" id="overridePill" style="display:none;">Override active</span>
          </div>
          <div class="gridWrap">
            <div id="grid" class="grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const DEFAULTS = { blue: 25, temp: 8000, mix: 100, mainZoom: 100, gridZoom: 100 };

  const modeToggle = document.getElementById('modeToggle');

  const filesInput = document.getElementById('files');
  const drop = document.getElementById('drop');
  const countPill = document.getElementById('countPill');
  const selectedPill = document.getElementById('selectedPill');
  const overridePill = document.getElementById('overridePill');

  const modePill = document.getElementById('modePill');
  const toggleEditBtn = document.getElementById('toggleEdit');
  const clearOverrideBtn = document.getElementById('clearOverride');

  const blue = document.getElementById('blue');
  const temp = document.getElementById('temp');
  const mix  = document.getElementById('mix');

  const blueVal = document.getElementById('blueVal');
  const tempVal = document.getElementById('tempVal');
  const mixVal  = document.getElementById('mixVal');

  const mainZoom = document.getElementById('mainZoom');
  const gridZoom = document.getElementById('gridZoom');
  const mainZoomVal = document.getElementById('mainZoomVal');
  const gridZoomVal = document.getElementById('gridZoomVal');

  const toggleAB = document.getElementById('toggleAB');
  const resetBtn = document.getElementById('reset');
  const downloadOneBtn = document.getElementById('downloadOne');
  const downloadAllBtn = document.getElementById('downloadAll');

  const viewport = document.getElementById('viewport');
  const tag = document.getElementById('tag');

  const mainCanvas = document.getElementById('mainCanvas');
  const mctx = mainCanvas.getContext('2d', { willReadFrequently: true });

  const grid = document.getElementById('grid');

  const items = [];
  let selectedId = null;
  let showBefore = false;

  const globalSettings = { blue: DEFAULTS.blue, temp: DEFAULTS.temp, mix: DEFAULTS.mix };
  let editSelected = false;

  // NEW: fit-to-viewport scale (so the whole image is visible by default)
  let fitScale = 1;

  const clamp255 = (x) => x < 0 ? 0 : (x > 255 ? 255 : x);

  function setTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('unyellower_theme', theme);
    modeToggle.setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    setTheme(cur === 'dark' ? 'light' : 'dark');
  }
  function initTheme(){
    const saved = localStorage.getItem('unyellower_theme');
    if (saved === 'light' || saved === 'dark') return setTheme(saved);
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');
  }

  function kelvinToGains(kelvin){
    let t = kelvin / 100;
    let r,g,b;
    if (t <= 66){
      r = 255;
      g = 99.4708025861 * Math.log(t) - 161.1195681661;
      b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
    } else {
      r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
      g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
      b = 255;
    }
    r = clamp255(r); g = clamp255(g); b = clamp255(b);
    let rr = r/255, gg = g/255, bb = b/255;
    const avg = (rr+gg+bb)/3 || 1;
    return { r: rr/avg, g: gg/avg, b: bb/avg };
  }

  function getSettingsForItem(it){
    return it.override ? it.override : globalSettings;
  }

  function computeAfter(baseImageData, w, h, settings){
    const blueBoost = parseInt(settings.blue, 10);
    const kelvin = parseInt(settings.temp, 10);
    const strength = parseInt(settings.mix, 10) / 100;
    const gains = kelvinToGains(kelvin);

    const out = new ImageData(new Uint8ClampedArray(baseImageData.data), w, h);
    const d = out.data;

    for (let i = 0; i < d.length; i += 4){
      const a = d[i+3];
      if (a === 0) continue;

      const r0 = d[i], g0 = d[i+1], b0 = d[i+2];

      let r1 = r0 * gains.r;
      let g1 = g0 * gains.g;
      let b1 = b0 * gains.b;

      const bb = blueBoost;
      b1 += bb;
      r1 -= bb * 0.15;
      g1 -= bb * 0.08;

      const r = r0 + (r1 - r0) * strength;
      const g = g0 + (g1 - g0) * strength;
      const b = b0 + (b1 - b0) * strength;

      d[i]   = clamp255(r);
      d[i+1] = clamp255(g);
      d[i+2] = clamp255(b);
    }
    return out;
  }

  function setZoomCSS(){
    document.documentElement.style.setProperty('--gridZoom', (parseInt(gridZoom.value,10)/100).toString());
    mainZoomVal.textContent = `${mainZoom.value}%`;
    gridZoomVal.textContent = `${gridZoom.value}%`;
    setMainTransform();
  }

  // NEW: compute fit scale so image is fully visible (no cropping)
  function computeFitScale(){
    const it = getSelected();
    if (!it) { fitScale = 1; return; }

    const pad = 28; // inner padding-ish
    const vw = Math.max(1, viewport.clientWidth - pad);
    const vh = Math.max(1, viewport.clientHeight - pad);

    fitScale = Math.min(vw / it.w, vh / it.h);
    // Do not upscale above 1 by default (keeps pixel-perfect when small)
    fitScale = Math.min(fitScale, 1);
  }

  // NEW: apply fitScale * zoom
  function setMainTransform(){
    const zoomScale = parseInt(mainZoom.value,10) / 100;
    const finalScale = fitScale * zoomScale;
    mainCanvas.style.transform = `translate(-50%, -50%) scale(${finalScale})`;
  }

  function updateSliderLabels(){
    blueVal.textContent = blue.value;
    tempVal.textContent = `${temp.value}K`;
    mixVal.textContent = `${mix.value}%`;
    setZoomCSS();
  }

  function getSelected(){
    return items.find(x => x.id === selectedId) || null;
  }

  function updateEditUI(){
    const it = getSelected();
    const hasOverride = !!(it && it.override);
    modePill.textContent = editSelected ? 'Selected (override)' : 'Batch (global)';
    toggleEditBtn.textContent = `Edit selected: ${editSelected ? 'ON' : 'OFF'}`;
    overridePill.style.display = hasOverride ? 'inline-flex' : 'none';
    clearOverrideBtn.disabled = !hasOverride || !it;
  }

  function syncSlidersFromMode(){
    const it = getSelected();
    if (editSelected && it){
      const s = getSettingsForItem(it);
      blue.value = s.blue; temp.value = s.temp; mix.value = s.mix;
    } else {
      blue.value = globalSettings.blue; temp.value = globalSettings.temp; mix.value = globalSettings.mix;
    }
    updateSliderLabels();
    updateEditUI();
  }

  function renderMain(){
    const it = getSelected();
    if (!it) {
      tag.style.display = 'none';
      mainCanvas.width = 1; mainCanvas.height = 1;
      mctx.clearRect(0,0,1,1);
      selectedPill.textContent = `Selected: —`;
      updateEditUI();
      return;
    }

    selectedPill.textContent = `Selected: ${it.name}`;
    mainCanvas.width = it.w;
    mainCanvas.height = it.h;

    // Fit-to-frame so it shows fully by default
    computeFitScale();
    setMainTransform();

    if (showBefore){
      mctx.putImageData(it.baseImageData, 0, 0);
      tag.style.display = 'block';
      tag.textContent = 'ANTES';
    } else {
      const s = getSettingsForItem(it);
      const out = computeAfter(it.baseImageData, it.w, it.h, s);
      mctx.putImageData(out, 0, 0);
      tag.style.display = 'block';
      tag.textContent = 'DESPUÉS';
    }
    updateEditUI();
  }

  function renderTile(it){
    if (!it.tileCanvas){
      it.tileCanvas = document.createElement('canvas');
      it.tileCtx = it.tileCanvas.getContext('2d', { willReadFrequently: true });
    }

    const maxW = 900;
    const scale = Math.min(1, maxW / it.w);
    const tw = Math.max(1, Math.round(it.w * scale));
    const th = Math.max(1, Math.round(it.h * scale));

    it.tileCanvas.width = tw;
    it.tileCanvas.height = th;

    const srcData = showBefore
      ? it.baseImageData
      : computeAfter(it.baseImageData, it.w, it.h, getSettingsForItem(it));

    const tmp = document.createElement('canvas');
    tmp.width = it.w; tmp.height = it.h;
    tmp.getContext('2d', { willReadFrequently: true }).putImageData(srcData, 0, 0);

    it.tileCtx.clearRect(0,0,tw,th);
    it.tileCtx.drawImage(tmp, 0, 0, tw, th);
  }

  function buildTile(it){
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = it.id;

    const meta = document.createElement('div');
    meta.className = 'tileMeta';
    meta.textContent = it.name;

    tile.appendChild(it.tileCanvas);
    tile.appendChild(meta);

    tile.addEventListener('click', () => {
      selectedId = it.id;
      [...grid.querySelectorAll('.tile')].forEach(el => el.classList.toggle('active', el.dataset.id === it.id));
      syncSlidersFromMode();
      renderMain();
    });

    it.tileEl = tile;
    grid.appendChild(tile);
  }

  function renderGrid(){
    for (const it of items) renderTile(it);
    [...grid.querySelectorAll('.tile')].forEach(el => el.classList.toggle('active', el.dataset.id === selectedId));
  }

  function applyFromSliders(){
    const it = getSelected();
    if (editSelected && it){
      it.override = { blue: parseInt(blue.value,10), temp: parseInt(temp.value,10), mix: parseInt(mix.value,10) };
    } else {
      globalSettings.blue = parseInt(blue.value,10);
      globalSettings.temp = parseInt(temp.value,10);
      globalSettings.mix  = parseInt(mix.value,10);
    }
    updateSliderLabels();
    renderMain();
    renderGrid();
    updateEditUI();
  }

  function updateCount(){
    countPill.textContent = `${items.length} image${items.length === 1 ? '' : 's'}`;
  }

  async function loadFiles(fileList){
    const files = Array.from(fileList || []).filter(f => f && f.type && f.type.startsWith('image/'));
    if (!files.length) return;

    for (const f of files){
      const url = URL.createObjectURL(f);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });

      const w = img.naturalWidth;
      const h = img.naturalHeight;

      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cctx = c.getContext('2d', { willReadFrequently: true });
      cctx.drawImage(img, 0, 0);
      const base = cctx.getImageData(0, 0, w, h);

      URL.revokeObjectURL(url);

      const it = {
        id: crypto.randomUUID(),
        name: f.name || `image_${items.length+1}`,
        w, h,
        baseImageData: base,
        tileCanvas: null, tileCtx: null, tileEl: null,
        override: null
      };

      it.tileCanvas = document.createElement('canvas');
      it.tileCtx = it.tileCanvas.getContext('2d', { willReadFrequently: true });

      items.push(it);
      buildTile(it);

      if (!selectedId) selectedId = it.id;
    }

    updateCount();
    [...grid.querySelectorAll('.tile')].forEach(el => el.classList.toggle('active', el.dataset.id === selectedId));

    // Zoom slider stays at 100, but image is FIT by default via fitScale
    mainZoom.value = "100";
    gridZoom.value = String(DEFAULTS.gridZoom);

    syncSlidersFromMode();
    renderMain();
    renderGrid();
  }

  function downloadCanvasAsPNG(canvas, filename){
    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  function downloadSelected(){
    const it = getSelected();
    if (!it) return;

    const out = computeAfter(it.baseImageData, it.w, it.h, getSettingsForItem(it));
    const c = document.createElement('canvas');
    c.width = it.w; c.height = it.h;
    c.getContext('2d').putImageData(out, 0, 0);

    downloadCanvasAsPNG(c, `unyellowed_${it.name.replace(/\.[^/.]+$/, '')}.png`);
  }

  async function downloadBatch(){
    if (!items.length) return;
    for (const it of items){
      const out = computeAfter(it.baseImageData, it.w, it.h, getSettingsForItem(it));
      const c = document.createElement('canvas');
      c.width = it.w; c.height = it.h;
      c.getContext('2d').putImageData(out, 0, 0);

      downloadCanvasAsPNG(c, `unyellowed_${it.name.replace(/\.[^/.]+$/, '')}.png`);
      await new Promise(r => setTimeout(r, 120));
    }
  }

  /* EVENTS */
  modeToggle.addEventListener('click', toggleTheme);
  modeToggle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
  });

  filesInput.addEventListener('change', (e) => loadFiles(e.target.files));

  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.style.borderColor = 'rgba(110,231,255,.6)'; });
  drop.addEventListener('dragleave', () => { drop.style.borderColor = ''; });
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.style.borderColor = '';
    loadFiles(e.dataTransfer.files);
  });

  [blue, temp, mix].forEach(el => el.addEventListener('input', applyFromSliders));
  [mainZoom, gridZoom].forEach(el => el.addEventListener('input', setZoomCSS));

  toggleEditBtn.addEventListener('click', () => {
    editSelected = !editSelected;
    syncSlidersFromMode();
  });

  clearOverrideBtn.addEventListener('click', () => {
    const it = getSelected();
    if (!it) return;
    it.override = null;
    syncSlidersFromMode();
    renderMain();
    renderGrid();
  });

  toggleAB.addEventListener('click', () => {
    if (!items.length) return;
    showBefore = !showBefore;
    renderMain();
    renderGrid();
  });

  resetBtn.addEventListener('click', () => {
    globalSettings.blue = DEFAULTS.blue;
    globalSettings.temp = DEFAULTS.temp;
    globalSettings.mix  = DEFAULTS.mix;

    editSelected = false;
    for (const it of items) it.override = null;

    blue.value = DEFAULTS.blue;
    temp.value = DEFAULTS.temp;
    mix.value  = DEFAULTS.mix;

    mainZoom.value = "100";
    gridZoom.value = String(DEFAULTS.gridZoom);

    updateSliderLabels();
    updateEditUI();
    renderMain();
    renderGrid();
  });

  downloadOneBtn.addEventListener('click', downloadSelected);
  downloadAllBtn.addEventListener('click', downloadBatch);

  // Ctrl/⌘ + wheel zoom on main
  viewport.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const cur = parseInt(mainZoom.value, 10);
    const next = Math.max(25, Math.min(220, cur + (e.deltaY > 0 ? -10 : 10)));
    mainZoom.value = String(next);
    setZoomCSS();
  }, { passive: false });

  // NEW: recompute fit on resize so it stays fully visible
  window.addEventListener('resize', () => {
    computeFitScale();
    setMainTransform();
  });

  /* INIT */
  initTheme();

  globalSettings.blue = DEFAULTS.blue;
  globalSettings.temp = DEFAULTS.temp;
  globalSettings.mix  = DEFAULTS.mix;

  blue.value = DEFAULTS.blue;
  temp.value = DEFAULTS.temp;
  mix.value  = DEFAULTS.mix;

  mainZoom.value = "100";
  gridZoom.value = String(DEFAULTS.gridZoom);

  updateSliderLabels();
  updateCount();
  renderMain();
  updateEditUI();
})();
</script>
