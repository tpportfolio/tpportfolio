<svg width="100%" height="100%" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <g id="circuit">
    <rect x="10" y="10" width="380" height="280" rx="16" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <polyline id="line1" points="30,30 80,30 80,60 120,60" stroke="#67e8f9" stroke-width="2" fill="none"/>
    <polyline id="line2" points="370,30 320,30 320,60 280,60" stroke="#67e8f9" stroke-width="2" fill="none"/>
    <polyline id="line3" points="30,270 80,270 80,240 120,240" stroke="#67e8f9" stroke-width="2" fill="none"/>
    <polyline id="line4" points="370,270 320,270 320,240 280,240" stroke="#67e8f9" stroke-width="2" fill="none"/>
    <circle id="node1" cx="80" cy="30" r="4" fill="#22d3ee"/>
    <circle id="node2" cx="320" cy="30" r="4" fill="#22d3ee"/>
    <circle id="node3" cx="80" cy="270" r="4" fill="#22d3ee"/>
    <circle id="node4" cx="320" cy="270" r="4" fill="#22d3ee"/>
  </g>
  <style>
    #line1, #line2, #line3, #line4, #node1, #node2, #node3, #node4 {
      opacity: 0.7;
      filter: drop-shadow(0 0 6px #67e8f9);
    }
    #circuit {
      animation: flicker 2s infinite linear;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      10% { opacity: 0.4; }
      20% { opacity: 1; }
      30% { opacity: 0.7; }
      40% { opacity: 1; }
      50% { opacity: 0.5; }
      60% { opacity: 1; }
      70% { opacity: 0.8; }
      80% { opacity: 1; }
      90% { opacity: 0.6; }
    }
  </style>
</svg>
